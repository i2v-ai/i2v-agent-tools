name: Test release packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - run: npm --prefix packages ci --ignore-scripts
      - run: npm --prefix packages test
      - run: |
          mkdir packed
          npm --prefix packages pack --workspace @i2v-ai/sdk --workspace @i2v-ai/cli --pack-destination "$PWD/packed"
          node scripts/smoke-packages.mjs packed

  cli-minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir packed
          npm --prefix packages pack --workspace @i2v-ai/cli --pack-destination "$PWD/packed"
          node scripts/smoke-packages.mjs packed --cli-only
