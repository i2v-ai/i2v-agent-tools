name: Publish the Python SDK

# Trusted Publishing: PyPI verifies this workflow through GitHub OIDC, so no
# long-lived token is stored in the repository. Configure the publisher once in
# the PyPI project settings: owner i2v-ai, repository i2v-agent-tools,
# workflow publish-pypi.yml, environment pypi.

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Also publish to PyPI (tag pushes publish automatically)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build packages/python-sdk --outdir dist
      - name: Check the distributions
        run: python -m twine check dist/*
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          version="$(python -c "import tomllib;print(tomllib.load(open('packages/python-sdk/pyproject.toml','rb'))['project']['version'])")"
          tag="${GITHUB_REF_NAME#python-v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/python-v') || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
